<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>mobile check</title>
<style>
  html,body{margin:0;background:#1e293b;font-family:-apple-system,sans-serif;color:#e2e8f0}
  .wrap{display:flex;gap:22px;padding:14px}
  .dev{width:390px;height:844px;border:0;background:#fff;border-radius:8px;box-shadow:0 0 0 6px #0f172a,0 12px 30px rgba(0,0,0,.5)}
  .col h1{font-size:13px;margin:0 0 6px;font-weight:700;letter-spacing:.04em;color:#94a3b8}
  .bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;width:390px}
  .bar button{font:600 12px/1 -apple-system,sans-serif;padding:8px 10px;border-radius:8px;border:0;background:#334155;color:#e2e8f0;cursor:pointer}
  .bar button:hover{background:#475569}
</style>
</head>
<body>
<div class="wrap">
  <div class="col">
    <h1>iPhone 390 × 844</h1>
    <iframe class="dev" id="fr" src="./index.html?m=1&r=0"></iframe>
    <div class="bar" id="bar"></div>
  </div>
</div>
<script>
  var acts = [
    ['home', 'function(w){w.KidsColoring.goHome();}'],
    ['coloring', 'function(w){w.KidsColoring.openGallery("dino");}'],
    ['puzzle', 'function(w){w.KidsColoring.openGallery("puzzle");}'],
    ['math', 'function(w){w.KidsColoring.openGallery("math");}'],
    ['memory', 'function(w){w.KidsColoring.startMemory(4);}'],
    ['memory8', 'function(w){w.KidsColoring.startMemory(8);}'],
    ['diff', 'function(w){w.KidsColoring.startDiff(0);}'],
    ['diff5', 'function(w){w.KidsColoring.startDiff(4);}'],
    ['diff1', 'function(w){w.KidsColoring.startDiff(1);}'],
    ['diff2', 'function(w){w.KidsColoring.startDiff(2);}'],
    ['diff3', 'function(w){w.KidsColoring.startDiff(3);}'],
    ['maze4', 'function(w){w.KidsColoring.startMaze(4);}'],
    ['maze', 'function(w){w.KidsColoring.startMaze(0);}'],
    ['piano', 'function(w){w.KidsColoring.startPiano();}'],
    ['pianoFollow', 'function(w){w.KidsColoring.startPiano();w.KidsColoring.pianoState.mode="free";document.getElementById("gPianoSeg").querySelectorAll("button")[1].click();}'],
    ['dots', 'function(w){w.KidsColoring.startDots(0);}'],
    ['dotsHouse', 'function(w){w.KidsColoring.startDots(2);}'],
    ['dotsHan', 'function(w){w.KidsColoring.startDots(4);}']
  ];
  var fr = document.getElementById('fr');
  fr.src = './index.html?m=1&r=' + Date.now();
  var bar = document.getElementById('bar');
  acts.forEach(function(a){
    var b = document.createElement('button');
    b.textContent = a[0];
    b.onclick = function(){
      var w = fr.contentWindow;
      (new Function('w', 'return (' + a[1] + ')(w);'))(w);
    };
    bar.appendChild(b);
  });
</script>
</body>
</html>
