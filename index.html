<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eaf5ff">
<meta name="format-detection" content="telephone=no">
<title>🎨 신나는 색칠놀이</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100dvh;color:#1e293b;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
    background:linear-gradient(165deg,#eaf5ff 0%,#f2ecff 42%,#fff0f7 100%);
    background-attachment:fixed;
    -webkit-user-select:none;user-select:none;
    overscroll-behavior:none;
  }
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .hidden{display:none!important}

  /* ---------- 미리보기 안내 배너 ---------- */
  #jsBanner{
    display:flex;align-items:flex-start;gap:9px;
    margin:0 0 14px;padding:14px 16px;border-radius:20px;
    background:#fff7ed;border:2px solid #fdba74;color:#9a3412;
    font-size:14.5px;font-weight:700;letter-spacing:-.02em;line-height:1.5;
    box-shadow:0 6px 16px rgba(249,115,22,.18);
  }
  #jsBanner .jb-ico{font-size:20px;line-height:1.35;flex:0 0 auto}
  #jsBanner .jb-txt{flex:1 1 auto;min-width:0}
  #jsBanner b{font-weight:900}

  /* ---------- 갤러리 ---------- */
  #gallery{padding:18px 14px calc(28px + env(safe-area-inset-bottom));max-width:900px;margin:0 auto}
  .hero h1{margin:4px 0 6px;font-size:27px;letter-spacing:-.035em}
  .hero p{margin:0 0 14px;font-size:14px;color:#64748b;font-weight:700}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;display:flex;align-items:center;gap:7px;
    font-size:15px;font-weight:800;letter-spacing:-.02em;color:#64748b;
    padding:11px 17px;border-radius:999px;background:#fff;
    box-shadow:0 3px 10px rgba(30,41,59,.09);white-space:nowrap;transition:background .15s,color .15s;
  }
  .tab.on{background:#1e293b;color:#fff;box-shadow:0 8px 18px rgba(30,41,59,.28)}
  .tab .em{font-size:17px;line-height:1}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
  .card{
    display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px;
    background:#fff;border-radius:26px;transition:transform .12s ease;
    box-shadow:0 5px 0 rgba(30,41,59,.06),0 12px 26px rgba(30,41,59,.08);
  }
  .card:active{transform:scale(.955)}
  .thumb{display:block;width:100%;aspect-ratio:1}
  .thumb svg{display:block;width:100%;height:100%;stroke-width:7px}
  .cname{font-size:14px;font-weight:800;letter-spacing:-.02em;padding-bottom:2px}
  .foot{margin-top:20px;text-align:center;font-size:12.5px;font-weight:700;color:#94a3b8}

  /* ---------- 색칠 화면 ---------- */
  #studio{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#eaf5ff 0%,#f5efff 100%)}
  .topbar{
    display:flex;align-items:center;gap:7px;
    padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));
  }
  .icbtn{
    flex:0 0 auto;width:42px;height:42px;border-radius:15px;background:#fff;
    font-size:19px;line-height:1;display:grid;place-items:center;
    box-shadow:0 2px 8px rgba(30,41,59,.12);transition:transform .1s ease,opacity .15s;
  }
  .icbtn.wide{width:auto;padding:0 13px;font-size:14px;font-weight:800;letter-spacing:-.03em}
  .icbtn:active{transform:scale(.92)}
  .icbtn[disabled]{opacity:.35}
  .stitle{
    flex:1 1 auto;min-width:0;text-align:center;font-size:16px;font-weight:800;letter-spacing:-.03em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;
  }
  .stage{flex:1 1 auto;min-height:0;display:grid;place-items:center;padding:2px 10px 6px;touch-action:none}
  .art{
    position:relative;width:300px;height:300px;background:#fff;border-radius:26px;overflow:hidden;
    isolation:isolate;box-shadow:0 12px 30px rgba(30,41,59,.13);
  }
  .slot{position:absolute;inset:0}
  .slot svg{display:block;width:100%;height:100%}
  .slot svg [data-colorable]{transition:fill .14s ease}
  #brush{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;mix-blend-mode:multiply}
  #brush.off{pointer-events:none}

  /* ---------- 도구 막대 ---------- */
  .tools{
    flex:0 0 auto;padding:10px 12px calc(12px + env(safe-area-inset-bottom));
    background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -8px 26px rgba(30,41,59,.12);
  }
  .modes{display:flex;align-items:center;gap:8px}
  .seg{flex:1 1 auto;display:flex;gap:5px;padding:4px;background:#f1f5f9;border-radius:17px;min-width:0}
  .seg button{
    flex:1 1 0;min-width:0;padding:10px 4px;border-radius:13px;font-size:14.5px;font-weight:800;
    letter-spacing:-.03em;color:#64748b;white-space:nowrap;transition:background .15s,color .15s;
  }
  .seg button.on{background:#fff;color:#1e293b;box-shadow:0 2px 8px rgba(30,41,59,.16)}
  .sizes{display:none;gap:6px;flex:0 0 auto}
  .tools.brush .sizes{display:flex}
  .tools.brush .seg button{font-size:13.5px}
  .sizes button{
    width:40px;height:40px;border-radius:13px;background:#f8fafc;border:2px solid #e2e8f0;
    display:grid;place-items:center;transition:border-color .15s,background .15s;
  }
  .sizes button.on{border-color:#1e293b;background:#fff}
  .dot{display:block;border-radius:50%;background:#1e293b}
  .palette{display:grid;grid-template-columns:repeat(9,1fr);gap:7px;margin-top:9px}
  .sw{
    position:relative;aspect-ratio:1;border-radius:50%;padding:0;
    box-shadow:inset 0 0 0 3px #fff,0 0 0 2px #e2e8f0;
    transition:transform .12s ease,box-shadow .15s;
  }
  .sw:active{transform:scale(.9)}
  .sw.on{box-shadow:inset 0 0 0 3px #fff,0 0 0 3px #1e293b;transform:scale(1.08)}
  .sw.erase{background:#fff;font-size:16px;display:grid;place-items:center;line-height:1}

  /* ---------- 모달 / 토스트 ---------- */
  .modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:26px;background:rgba(15,23,42,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .sheet{width:min(320px,100%);padding:24px 20px 18px;background:#fff;border-radius:26px;text-align:center;box-shadow:0 24px 60px rgba(15,23,42,.35)}
  .sheet p{margin:0 0 18px;font-size:16px;font-weight:800;letter-spacing:-.02em}
  .sheet .row{display:flex;gap:10px}
  .sheet .row button{flex:1 1 0;padding:13px 0;border-radius:15px;font-size:15px;font-weight:800}
  #cancelClear{background:#f1f5f9;color:#475569}
  #confirmClear{background:#ef4444;color:#fff;box-shadow:0 6px 14px rgba(239,68,68,.35)}
  .toast{
    position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));z-index:60;
    padding:12px 20px;border-radius:999px;background:#1e293b;color:#fff;
    font-size:14px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;
    opacity:0;transform:translate(-50%,16px);pointer-events:none;transition:opacity .22s,transform .22s;
    box-shadow:0 10px 26px rgba(15,23,42,.35);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (min-width:700px){
    .hero h1{font-size:31px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
    .cname{font-size:15px}
    .tools{max-width:640px;margin:0 auto;border-radius:26px;margin-bottom:12px}
    .palette{grid-template-columns:repeat(17,1fr)}
  }
  /* ---------- 연산 놀이 카드 / 퀴즈 ---------- */
  .quizcard{
    grid-column:1/-1;display:flex;flex-direction:column;gap:10px;padding:16px 16px 14px;
    background:linear-gradient(135deg,#fffbeb 0%,#fff7ed 55%,#f0f9ff 100%);
    border:2px dashed #fdba74;border-radius:26px;
    box-shadow:0 5px 0 rgba(30,41,59,.06),0 12px 26px rgba(30,41,59,.10);
  }
  .quizcard h2{margin:0;font-size:18px;font-weight:900;letter-spacing:-.03em}
  .quizcard p{margin:0;font-size:13.5px;font-weight:800;color:#b45309;letter-spacing:-.02em}
  .qlevels{display:flex;gap:8px}
  .qlv{
    flex:1 1 0;min-width:0;padding:12px 6px;border-radius:16px;background:#fff;
    font-size:15px;font-weight:900;letter-spacing:-.03em;
    box-shadow:0 3px 0 rgba(30,41,59,.10);transition:transform .12s ease;
  }
  .qlv small{display:block;margin-top:3px;font-size:11.5px;font-weight:800;color:#64748b;letter-spacing:-.02em}
  .qlv:active{transform:scale(.96)}
  .qlv.easy{color:#15803d}
  .qlv.norm{color:#7c3aed}

  #quiz{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;
        background:linear-gradient(180deg,#eaf5ff 0%,#fff5fb 100%)}
  .qtop{display:flex;align-items:center;gap:7px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top))}
  .qscore{
    flex:0 0 auto;padding:10px 12px;border-radius:15px;background:#fff;
    font-size:15px;font-weight:900;letter-spacing:-.02em;box-shadow:0 2px 8px rgba(30,41,59,.12);
  }
  .qstage{
    flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:9px;padding:4px 16px calc(18px + env(safe-area-inset-bottom));
    overflow-y:auto;
  }
  .qprogress{font-size:13px;font-weight:800;color:#94a3b8;letter-spacing:-.02em}
  .qeq{font-size:46px;font-weight:900;letter-spacing:-.03em;color:#1e293b;line-height:1.12;text-align:center}
  .qhint{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:5px;
    min-height:42px;font-size:27px;line-height:1.25;text-align:center;
  }
  .qhint .grp{letter-spacing:1px}
  .qhint .op{font-size:23px;font-weight:900;color:#94a3b8;padding:0 2px}
  .qhint .take{opacity:.3}
  .qhint .stars{gap:2px;font-size:22px;letter-spacing:1px}
  .qmsg{
    min-height:26px;font-size:16px;font-weight:900;letter-spacing:-.02em;
    color:#64748b;text-align:center;
  }
  .qmsg.ok{color:#16a34a}
  .qmsg.bad{color:#f97316}
  .qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(340px,100%)}
  .qopts.solo{grid-template-columns:1fr}
  .qopt{
    aspect-ratio:1.55;border-radius:22px;background:#fff;color:#1e293b;
    font-size:38px;font-weight:900;letter-spacing:-.02em;
    box-shadow:0 4px 0 rgba(30,41,59,.10),0 10px 22px rgba(30,41,59,.08);
    transition:transform .1s ease,background .15s,opacity .15s;
  }
  .qopt:active{transform:scale(.96)}
  .qopt.ok{background:#dcfce7;color:#15803d;box-shadow:0 4px 0 rgba(22,163,74,.28)}
  .qopt.bad{background:#ffe4e6;color:#e11d48;opacity:.5;box-shadow:0 4px 0 rgba(225,29,72,.14)}
  .qresult{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;text-align:center}
  .qbig{font-size:62px;line-height:1}
  .qscoretext{font-size:21px;font-weight:900;letter-spacing:-.03em}
  .qstage .qlevels{width:min(340px,100%)}

</style>
</head>
<body>

<!-- ================= 갤러리 ================= -->
<div id="gallery">

  <!-- JS 차단(QuickLook 미리보기) 환경 안내: 스크립트가 실행되면 즉시 숨겨진다 -->
  <div id="jsBanner" role="note">
    <span class="jb-ico" aria-hidden="true">📱</span>
    <span class="jb-txt"><b>미리보기에서는 색칠하기가 안 돼요!</b><br>공유 버튼(⬆️) → <b>'Safari로 열기'</b>를 눌러주세요.</span>
  </div>
  <script>document.getElementById('jsBanner').style.display = 'none';</script>

  <header class="hero">
    <h1>🎨 신나는 색칠놀이</h1>
    <p>마음에 드는 그림을 골라서 톡톡 칠해보세요! 한글·알파벳·숫자도 배워요 🖍️</p>
  </header>
  <!-- JS가 실행되지 않는 미리보기에서도 첫 화면이 보이도록 정적 HTML로 미리 그려 둔다.
       JS가 실행되면 renderTabs()/renderGrid()가 같은 내용으로 덮어쓴다. -->
  <nav class="tabs" id="tabs" aria-label="도안 카테고리">
    <button class="tab on" data-cat="dino"><span class="em">🦖</span>공룡·동물</button>
    <button class="tab" data-cat="car"><span class="em">🚗</span>탈것</button>
    <button class="tab" data-cat="xmas"><span class="em">🎄</span>크리스마스</button>
    <button class="tab" data-cat="tale"><span class="em">👑</span>동화·자연</button>
    <button class="tab" data-cat="magic"><span class="em">🪄</span>요정·로봇</button>
    <button class="tab" data-cat="hangul"><span class="em">🇰🇷</span>한글</button>
    <button class="tab" data-cat="abc"><span class="em">🔤</span>알파벳</button>
    <button class="tab" data-cat="math"><span class="em">🔢</span>숫자·연산</button>
  </nav>
  <main class="grid" id="grid">
    <button class="card" data-id="trex" aria-label="티라노사우루스 색칠하기"><span class="thumb"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="티라노사우루스 도안"><path d="M298 210 C 348 202 366 162 374 116 C 396 176 378 250 304 274 Z" fill="#ffffff" data-colorable="true"/><rect x="166" y="260" width="50" height="84" rx="25" fill="#ffffff" data-colorable="true"/><rect x="240" y="260" width="50" height="84" rx="25" fill="#ffffff" data-colorable="true"/><ellipse cx="191" cy="344" rx="38" ry="15" fill="#ffffff" data-colorable="true"/><ellipse cx="265" cy="344" rx="38" ry="15" fill="#ffffff" data-colorable="true"/><ellipse cx="228" cy="208" rx="88" ry="86" fill="#ffffff" data-colorable="true"/><ellipse cx="232" cy="262" rx="58" ry="30" fill="#ffffff" data-colorable="true"/><path d="M214 134 L 228 100 L 250 130 Z" fill="#ffffff" data-colorable="true"/><path d="M256 138 L 272 108 L 290 140 Z" fill="#ffffff" data-colorable="true"/><ellipse cx="144" cy="126" rx="78" ry="66" fill="#ffffff" data-colorable="true"/><ellipse cx="148" cy="250" rx="13" ry="19" transform="rotate(28 148 250)" fill="#ffffff" data-colorable="true"/><path d="M72 134 C 106 154 142 156 172 144 C 168 180 118 190 92 172 C 78 162 72 148 72 134 Z" fill="#ffffff" data-colorable="true"/><path d="M108 150 l 5 16 l 9 -13 Z" fill="#ffffff" stroke-width="3" data-colorable="false"/><path d="M138 152 l 5 16 l 9 -13 Z" fill="#ffffff" stroke-width="3" data-colorable="false"/><circle cx="118" cy="94" r="17" fill="#ffffff" data-colorable="true"/><circle cx="116" cy="97" r="7" fill="#1e293b" stroke="none" data-colorable="false"/><circle cx="82" cy="118" r="4.5" fill="#1e293b" stroke="none" data-colorable="false"/></svg></span><span class="cname">티라노사우루스</span></button>

  /* ============ 상태 ============ */
  var state = {
    cat: CATEGORIES[0].id,
    design: null,
    mode: 'fill',
    tool: 'color',
    hex: COLORS[0][0],
    sizeIdx: 1,
    history: [],
    strokes: [],
    drawing: null
  };

  var toastTimer = null;

  /* ============ 유틸 ============ */
  function svgMarkup(d){
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" ' +
      'fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" ' +
      'role="img" aria-label="' + d.title + ' 도안">' + d.body + '</svg>';
  }

  function findDesign(id){
    for(var i = 0; i < DESIGNS.length; i++){
      if(DESIGNS[i].id === id) return DESIGNS[i];
    }
    return null;
  }

  function toast(msg){
    var studioOpen = !studioEl.classList.contains('hidden');
    var off = 26;
    if(studioOpen){
      var tb = toolsEl.getBoundingClientRect();
      off = Math.round(tb.height || 0) + 16;
    }
    toastEl.style.bottom = 'calc(' + off + 'px + env(safe-area-inset-bottom))';
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1900);
  }

  /* ============ 갤러리 ============ */
  function renderTabs(){
    var html = '';
    for(var i = 0; i < CATEGORIES.length; i++){
      var c = CATEGORIES[i];
      html += '<button class="tab' + (c.id === state.cat ? ' on' : '') + '" data-cat="' + c.id + '">' +
              '<span class="em">' + c.emoji + '</span>' + c.name + '</button>';
    }
    tabsEl.innerHTML = html;
  }

  function renderGrid(){
    var list = DESIGNS.filter(function(d){ return d.cat === state.cat; });
    var html = (state.cat === 'math') ? quizBanner() : '';
    for(var i = 0; i < list.length; i++){
      var d = list[i];
      html += '<button class="card" data-id="' + d.id + '" aria-label="' + d.title + ' 색칠하기">' +
              '<span class="thumb">' + svgMarkup(d) + '</span>' +
              '<span class="cname">' + d.title + '</span></button>';
    }
    gridEl.innerHTML = html;
  }

  function selectCat(id){
    state.cat = id;
    var tabs = tabsEl.querySelectorAll('.tab');
    for(var i = 0; i < tabs.length; i++){
      tabs[i].classList.toggle('on', tabs[i].getAttribute('data-cat') === id);
    }
    renderGrid();
  }

  tabsEl.addEventListener('click', function(e){
    var t = e.target.closest('.tab');
    if(!t) return;
    selectCat(t.getAttribute('data-cat'));
  });

  gridEl.addEventListener('click', function(e){
    var lv = e.target.closest('.qlv');
    if(lv){ startQuiz(lv.getAttribute('data-level')); return; }
    var c = e.target.closest('.card');
    if(!c) return;
    var d = findDesign(c.getAttribute('data-id'));
    if(d) openDesign(d);
  });

  /* ============ 팔레트 / 모드 ============ */
  function renderPalette(){
    var html = '';
    for(var i = 0; i < COLORS.length; i++){
      html += '<button class="sw' + (i === 0 ? ' on' : '') + '" data-hex="' + COLORS[i][0] + '" ' +
              'style="background:' + COLORS[i][0] + '" aria-label="' + COLORS[i][1] + '"></button>';
    }
    html += '<button class="sw erase" id="eraserBtn" aria-label="지우개">🧽</button>';
    paletteEl.innerHTML = html;
  }

  function markSwatch(btn){
    var all = paletteEl.querySelectorAll('.sw');
    for(var i = 0; i < all.length; i++) all[i].classList.remove('on');
    if(btn) btn.classList.add('on');
  }

  paletteEl.addEventListener('click', function(e){
    var b = e.target.closest('.sw');
    if(!b) return;
    markSwatch(b);
    if(b.id === 'eraserBtn'){
      state.tool = 'eraser';
    } else {
      state.tool = 'color';
      state.hex = b.getAttribute('data-hex');
    }
  });

  segEl.addEventListener('click', function(e){
    var b = e.target.closest('button');
    if(!b) return;
    setMode(b.getAttribute('data-mode'));
  });

  sizesEl.addEventListener('click', function(e){
    var b = e.target.closest('button');
    if(!b) return;
    state.sizeIdx = parseInt(b.getAttribute('data-size'), 10) || 0;
    var all = sizesEl.querySelectorAll('button');
    for(var i = 0; i < all.length; i++){
      all[i].classList.toggle('on', all[i] === b);
    }
  });

  function setMode(m){
    state.mode = m;
    var btns = segEl.querySelectorAll('button');
    for(var i = 0; i < btns.length; i++){
      btns[i].classList.toggle('on', btns[i].getAttribute('data-mode') === m);
    }
    toolsEl.classList.toggle('brush', m === 'brush');
    brush.classList.toggle('off', m !== 'brush');
  }

  /* ============ 색칠 화면 ============ */
  function openDesign(d){
    state.design = d;
    state.history = [];
    state.strokes = [];
    state.drawing = null;
    state.tool = 'color';
    state.hex = COLORS[0][0];
    state.sizeIdx = 1;

    markSwatch(paletteEl.querySelector('.sw'));
    var allSizes = sizesEl.querySelectorAll('button');
    for(var i = 0; i < allSizes.length; i++){
      allSizes[i].classList.toggle('on', allSizes[i].getAttribute('data-size') === '1');
    }

    svgSlot.innerHTML = svgMarkup(d);
    titleEl.textContent = d.title;
    setMode('fill');
    updateUndo();
    redraw();

    galleryEl.classList.add('hidden');
    studioEl.classList.remove('hidden');
    requestAnimationFrame(fitArt);
  }

  function closeStudio(){
    if(state.drawing) endStroke(true);
    studioEl.classList.add('hidden');
    galleryEl.classList.remove('hidden');
    window.scrollTo(0, 0);
  }

  function fitArt(){
    var r = stageEl.getBoundingClientRect();
    var side = Math.floor(Math.min(r.width, r.height)) - 6;
    if(side < 120) side = 120;
    artEl.style.width = side + 'px';
    artEl.style.height = side + 'px';
    sizeCanvas(side);
  }

  function sizeCanvas(side){
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    var px = Math.max(1, Math.round(side * dpr));
    if(brush.width !== px || brush.height !== px){
      brush.width = px;
      brush.height = px;
    }
    redraw();
  }

  /* ---------- 채우기 ---------- */
  function fillAt(target){
    var el = target.closest ? target.closest('[data-colorable]') : null;
    if(!el) return;
    if(el.getAttribute('data-colorable') !== 'true') return;

    var color = (state.tool === 'eraser') ? '#ffffff' : state.hex;
    var prev = el.getAttribute('fill') || '#ffffff';
    if(String(prev).toLowerCase() === String(color).toLowerCase()) return;

    el.setAttribute('fill', color);
    state.history.push({kind:'fill', el:el, prev:prev});
    updateUndo();
  }

  svgSlot.addEventListener('pointerdown', function(e){
    if(state.mode !== 'fill') return;
    e.preventDefault();
    fillAt(e.target);
  });

  /* ---------- 크레파스 ---------- */
  function pt(e){
    var r = brush.getBoundingClientRect();
    var x = (e.clientX - r.left) / (r.width || 1);
    var y = (e.clientY - r.top) / (r.height || 1);
    return {x: Math.max(-0.05, Math.min(1.05, x)), y: Math.max(-0.05, Math.min(1.05, y))};
  }

  function paintCtx(s){
    ctx.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.color;
    ctx.fillStyle = s.color;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(1, s.width * brush.width);
  }

  function drawDot(s){
    paintCtx(s);
    var p = s.points[0];
    ctx.beginPath();
    ctx.arc(p.x * brush.width, p.y * brush.height, Math.max(0.6, ctx.lineWidth / 2), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawWhole(s){
    var pts = s.points;
    paintCtx(s);
    if(pts.length < 2){ drawDot(s); return; }
    ctx.beginPath();
    ctx.moveTo(pts[0].x * brush.width, pts[0].y * brush.height);
    for(var i = 1; i < pts.length - 1; i++){
      var mx = ((pts[i].x + pts[i + 1].x) / 2) * brush.width;
      var my = ((pts[i].y + pts[i + 1].y) / 2) * brush.height;
      ctx.quadraticCurveTo(pts[i].x * brush.width, pts[i].y * brush.height, mx, my);
    }
    var last = pts[pts.length - 1];
    ctx.lineTo(last.x * brush.width, last.y * brush.height);
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawTail(s){
    var pts = s.points;
    var n = pts.length;
    if(n < 2) return;
    paintCtx(s);
    ctx.beginPath();
    if(n === 2){
      ctx.moveTo(pts[0].x * brush.width, pts[0].y * brush.height);
      ctx.lineTo(pts[1].x * brush.width, pts[1].y * brush.height);
    } else {
      var p0 = pts[n - 3], p1 = pts[n - 2], p2 = pts[n - 1];
      var ax = ((p0.x + p1.x) / 2) * brush.width, ay = ((p0.y + p1.y) / 2) * brush.height;
      var bx = ((p1.x + p2.x) / 2) * brush.width, by = ((p1.y + p2.y) / 2) * brush.height;
      ctx.moveTo(ax, ay);
      ctx.quadraticCurveTo(p1.x * brush.width, p1.y * brush.height, bx, by);
    }
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }

  function redraw(){
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, brush.width, brush.height);
    ctx.globalCompositeOperation = 'source-over';
    for(var i = 0; i < state.strokes.length; i++){
      drawWhole(state.strokes[i]);
    }
  }

  function startStroke(e){
    if(state.mode !== 'brush' || state.drawing) return;
    e.preventDefault();
    try { brush.setPointerCapture(e.pointerId); } catch(err) {}
    var s = {
      color: state.hex,
      width: BRUSH_W[state.sizeIdx],
      erase: state.tool === 'eraser',
      points: [pt(e)]
    };
    state.drawing = s;
    state.strokes.push(s);
    drawDot(s);
  }

  function moveStroke(e){
    if(!state.drawing) return;
    e.preventDefault();
    var p = pt(e);
    var pts = state.drawing.points;
    var last = pts[pts.length - 1];
    var dx = p.x - last.x, dy = p.y - last.y;
    if((dx * dx + dy * dy) < 0.000004) return;
    pts.push(p);
    if(pts.length === 1) drawDot(state.drawing); else drawTail(state.drawing);
  }

  function endStroke(cancel){
    if(!state.drawing) return;
    var s = state.drawing;
    state.drawing = null;
    if(cancel){
      var i = state.strokes.indexOf(s);
      if(i > -1) state.strokes.splice(i, 1);
      redraw();
      return;
    }
    if(s.points.length === 1) drawDot(s);
    else drawWhole(s);
    state.history.push({kind:'stroke', stroke:s});
    updateUndo();
  }

  brush.addEventListener('pointerdown', startStroke);
  brush.addEventListener('pointermove', moveStroke);
  brush.addEventListener('pointerup', function(){ endStroke(false); });
  brush.addEventListener('pointercancel', function(){ endStroke(false); });

  /* ---------- 되돌리기 / 초기화 ---------- */
  function updateUndo(){
    undoBtn.disabled = state.history.length === 0;
  }

  function undo(){
    if(state.drawing) endStroke(false);
    var h = state.history.pop();
    if(!h) return;
    if(h.kind === 'fill'){
      h.el.setAttribute('fill', h.prev);
    } else if(h.kind === 'stroke'){
      var i = state.strokes.indexOf(h.stroke);
      if(i > -1) state.strokes.splice(i, 1);
      redraw();
    }
    updateUndo();
  }

  function clearAll(){
    var els = svgSlot.querySelectorAll('[data-colorable="true"]');
    for(var i = 0; i < els.length; i++) els[i].setAttribute('fill', '#ffffff');
    state.strokes = [];
    state.history = [];
    state.drawing = null;
    redraw();
    updateUndo();
    toast('새 도안처럼 지웠어요 ✨');
  }

  /* ---------- 저장 ---------- */
  function isIOS(){
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  function b64(str){
    var bytes = new TextEncoder().encode(str);
    var bin = '';
    for(var i = 0; i < bytes.length; i += 4096){
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 4096));
    }
    return btoa(bin);
  }

  function saveImage(){
    var svgEl = svgSlot.querySelector('svg');
    if(!svgEl) return;
    var size = 1080;
    var out = document.createElement('canvas');
    out.width = size;
    out.height = size;
    var octx = out.getContext('2d');
    octx.fillStyle = '#ffffff';
    octx.fillRect(0, 0, size, size);

    var clone = svgEl.cloneNode(true);
    clone.setAttribute('width', size);
    clone.setAttribute('height', size);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    var src = new XMLSerializer().serializeToString(clone);
    var img = new Image();
    img.onload = function(){
      octx.drawImage(img, 0, 0, size, size);
      if(state.strokes.length){
        octx.globalCompositeOperation = 'multiply';
        octx.drawImage(brush, 0, 0, size, size);
        octx.globalCompositeOperation = 'source-over';
      }
      var url;
      try { url = out.toDataURL('image/png'); }
      catch(err){ toast('저장이 안 됐어요 😢'); return; }

      var name = '색칠놀이_' + (state.design ? state.design.title : '그림') + '.png';
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.target = '_blank';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      toast(isIOS() ? '그림을 열었어요! 길게 눌러 저장해요 📷' : '그림을 저장했어요! 💾');
    };
    img.onerror = function(){ toast('저장이 안 됐어요 😢'); };
    img.src = 'data:image/svg+xml;base64,' + b64(src);
  }

  /* ---------- 버튼 연결 ---------- */
  backBtn.addEventListener('click', closeStudio);
  undoBtn.addEventListener('click', undo);
  saveBtn.addEventListener('click', saveImage);
  resetBtn.addEventListener('click', function(){
    if(state.history.length === 0 && state.strokes.length === 0){
      toast('아직 칠한 게 없어요 🙂');
      return;
    }
    modalEl.classList.remove('hidden');
  });
  document.getElementById('cancelClear').addEventListener('click', function(){
    modalEl.classList.add('hidden');
  });
  document.getElementById('confirmClear').addEventListener('click', function(){
    modalEl.classList.add('hidden');
    clearAll();
  });

  window.addEventListener('resize', function(){
    if(!studioEl.classList.contains('hidden')) fitArt();
  });
  window.addEventListener('orientationchange', function(){
    setTimeout(function(){ if(!studioEl.classList.contains('hidden')) fitArt(); }, 260);
  });

  /* ============ 연산 놀이 (숫자·연산 탭) ============ */
  var quizEl = document.getElementById('quiz');
  var qStage = document.getElementById('qStage');
  var quizScoreEl = document.getElementById('quizScore');
  var quizBack = document.getElementById('quizBack');

  var QEMOJI = ['🍎', '🍓', '🍌', '🍇', '⭐', '🐣', '🚗', '🍪', '🐟', '🎈', '🐰', '🌸'];
  var QUIZ = { level: 'easy', q: null, idx: 0, total: 10, score: 0, tries: 0, lock: false };

  function rnd(n){ return Math.floor(Math.random() * n); }

  function shuffle(a){
    for(var i = a.length - 1; i > 0; i--){
      var j = rnd(i + 1), t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  function makeQuestion(level){
    var a, b, op, guard = 0;
    if(level === 'easy'){
      do { a = 1 + rnd(4); b = 1 + rnd(4); } while(a + b > 5 && guard++ < 100);
      op = '+';
    } else if(Math.random() < 0.5){
      do { a = 1 + rnd(9); b = 1 + rnd(9); } while(a + b > 10 && guard++ < 100);
      op = '+';
    } else {
      a = 2 + rnd(9);          /* 2 ~ 10 */
      b = 1 + rnd(a - 1);      /* 1 ~ a-1 */
      op = '−';
    }
    var ans = (op === '+') ? (a + b) : (a - b);
    var emoji = QEMOJI[rnd(QEMOJI.length)];

    /* 그림 힌트: 더하기는 두 무더기, 빼기는 마지막 b개를 흐리게 */
    var hint;
    if(op === '+'){
      hint = '<span class="grp">' + emoji.repeat(a) + '</span>' +
             '<span class="op">+</span>' +
             '<span class="grp">' + emoji.repeat(b) + '</span>';
    } else {
      hint = '<span class="grp">' + emoji.repeat(a - b) + '</span>' +
             '<span class="grp take">' + emoji.repeat(b) + '</span>';
    }

    /* 보기 4개: 정답 근처 숫자로 */
    var opts = [ans];
    guard = 0;
    while(opts.length < 4 && guard++ < 300){
      var d = 1 + rnd(4);
      var v = ans + (Math.random() < 0.5 ? -d : d);
      if(v >= 0 && v <= 12 && opts.indexOf(v) < 0) opts.push(v);
    }
    while(opts.length < 4) opts.push(opts.length + 11);   /* 안전장치 */

    return { a: a, b: b, op: op, ans: ans, hint: hint, opts: shuffle(opts) };
  }

  function quizBanner(){
    return '<div class="quizcard">' +
      '<h2>🧮 연산 놀이</h2>' +
      '<p>그림을 세면서 더하기·빼기를 익혀요!</p>' +
      '<div class="qlevels">' +
        '<button class="qlv easy" data-level="easy">🌱 쉬움<small>한 자리 덧셈 (합 5까지)</small></button>' +
        '<button class="qlv norm" data-level="norm">🌟 보통<small>덧셈·뺄셈 (1~10)</small></button>' +
      '</div></div>';
  }

  function startQuiz(level){
    QUIZ.level = (level === 'norm') ? 'norm' : 'easy';
    QUIZ.idx = 0;
    QUIZ.score = 0;
    QUIZ.lock = false;
    quizScoreEl.textContent = '⭐ 0';
    galleryEl.classList.add('hidden');
    studioEl.classList.add('hidden');
    quizEl.classList.remove('hidden');
    nextQuestion();
  }

  function closeQuiz(){
    quizEl.classList.add('hidden');
    qStage.innerHTML = '';
    QUIZ.q = null;
    QUIZ.lock = true;
    galleryEl.classList.remove('hidden');
    window.scrollTo(0, 0);
  }

  function nextQuestion(){
    if(quizEl.classList.contains('hidden')) return;
    if(QUIZ.idx >= QUIZ.total){ showResult(); return; }
    QUIZ.idx++;
    QUIZ.tries = 0;
    QUIZ.lock = false;
    QUIZ.q = makeQuestion(QUIZ.level);
    renderQuestion();
  }

  function renderQuestion(){
    var q = QUIZ.q;
    var h = '<div class="qprogress">문제 ' + QUIZ.idx + ' / ' + QUIZ.total + '</div>' +
            '<div class="qeq">' + q.a + ' ' + q.op + ' ' + q.b + ' = ?</div>' +
            '<div class="qhint">' + q.hint + '</div>' +
            '<div class="qmsg" id="qMsg">정답을 눌러보세요! 🙂</div>' +
            '<div class="qopts">';
    for(var i = 0; i < q.opts.length; i++){
      h += '<button class="qopt" data-val="' + q.opts[i] + '">' + q.opts[i] + '</button>';
    }
    h += '</div>';
    qStage.innerHTML = h;
    quizScoreEl.textContent = '⭐ ' + QUIZ.score;
  }

  function answerQuiz(btn){
    if(QUIZ.lock || !QUIZ.q) return;
    var q = QUIZ.q;
    var v = parseInt(btn.getAttribute('data-val'), 10);
    var msg = document.getElementById('qMsg');

    if(v === q.ans){
      QUIZ.lock = true;
      btn.classList.add('ok');
      QUIZ.score++;
      quizScoreEl.textContent = '⭐ ' + QUIZ.score;
      if(msg){ msg.className = 'qmsg ok'; msg.textContent = '🎉 정답! 참 잘했어요!'; }
      setTimeout(nextQuestion, 1050);
      return;
    }

    QUIZ.tries++;
    btn.classList.add('bad');
    btn.disabled = true;
    if(QUIZ.tries >= 3){
      QUIZ.lock = true;
      var right = qStage.querySelector('.qopt[data-val="' + q.ans + '"]');
      if(right) right.classList.add('ok');
      if(msg){ msg.className = 'qmsg bad'; msg.textContent = '정답은 ' + q.ans + '! 같이 세어봐요 😊'; }
      setTimeout(nextQuestion, 1700);
    } else if(msg){
      msg.className = 'qmsg bad';
      msg.textContent = '다시 세어 볼까요? 😊';
    }
  }

  function showResult(){
    var s = QUIZ.score, n = QUIZ.total;
    var face = s >= 9 ? '🏆' : (s >= 6 ? '🎉' : '🌱');
    var word = s >= 9 ? '최고예요! 연산 왕이네요!' : (s >= 6 ? '참 잘했어요!' : '조금 더 해볼까요?');
    var stars = '';
    for(var i = 0; i < n; i++) stars += (i < s ? '⭐' : '☆');
    qStage.innerHTML =
      '<div class="qresult">' +
        '<div class="qbig">' + face + '</div>' +
        '<div class="qscoretext">' + n + '문제 중 ' + s + '개 맞혔어요!</div>' +
        '<div class="qhint stars">' + stars + '</div>' +
        '<p class="qmsg">' + word + '</p>' +
        '<div class="qlevels">' +
          '<button class="qlv easy" data-act="again">한 번 더</button>' +
          '<button class="qlv norm" data-act="stop">그만하기</button>' +
        '</div>' +
      '</div>';
    QUIZ.q = null;
  }

  quizBack.addEventListener('click', closeQuiz);

  qStage.addEventListener('click', function(e){
    var opt = e.target.closest('.qopt');
    if(opt && !opt.disabled){ answerQuiz(opt); return; }
    var act = e.target.closest('[data-act]');
    if(!act) return;
    if(act.getAttribute('data-act') === 'again') startQuiz(QUIZ.level);
    else closeQuiz();
  });

  /* ---------- 시작 ---------- */
  renderTabs();
  renderGrid();
  renderPalette();
  footEl.textContent = '도안 ' + DESIGNS.length + '개 · 손가락으로 톡톡 칠해요 🖍️';

  window.KidsColoring = {
    designs: DESIGNS,
    state: state,
    openDesign: openDesign,
    setMode: setMode,
    fillAt: fillAt,
    undo: undo,
    clearAll: clearAll,
    redraw: redraw,
    startQuiz: startQuiz
  };
})();
</script>
</body>
</html>
